<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Classroom Visual Schedule</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="board" class="board">
    <div class="topbar">
      <div class="time" id="currentTime">--:-- --</div>

      <div class="topbar-actions">
        <div class="tools-menu" id="toolsMenu">
          <button class="btn" id="btnTools">Tools ▾</button>
          <div class="tools-dropdown hidden" id="toolsDropdown">
            <button class="tools-item" id="toolsCoreBoard">Core Board</button>
            <button class="tools-item" id="toolsWhosHere">Who's here</button>
          </div>
        </div>
        <button class="btn" id="btnVideos">Videos</button>
        <button class="btn" id="btnMeetings">Meetings</button>
        <button class="btn" id="btnWebsites">Websites</button>
        <div class="settings-menu" id="settingsMenu">
          <button class="btn" id="btnSettings" aria-expanded="false" aria-haspopup="dialog" aria-controls="settingsPanel">Settings ▾</button>
          <div class="settings-panel hidden" id="settingsPanel">
            <div class="settings-section">
              <div class="settings-section-title">Schedule Editing</div>
              <label class="settings-toggle" for="toggleEditMode">
                <input type="checkbox" id="toggleEditMode" />
                <span>Edit Schedule</span>
              </label>
              <button class="btn btn-danger settings-action hidden" id="btnReset">Reset Schedule</button>
            </div>
            <div class="settings-section">
              <div class="settings-section-title">Schedule Display</div>
              <label class="settings-toggle" for="toggleShowFullSchedule">
                <input type="checkbox" id="toggleShowFullSchedule" />
                <span>Show Full Schedule</span>
              </label>
              <label class="settings-toggle" for="toggleShowNowNext">
                <input type="checkbox" id="toggleShowNowNext" />
                <span>Show Now / Next</span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="layout">
      <div id="scheduleGrid" class="schedule-grid" aria-label="Schedule"></div>
    </div>

    <div id="currentBox" class="current-box" role="region" aria-label="Current and next activity">
      <div class="current-now">
        <div class="timer-disk" id="timerDisk"></div>
        <div class="current-content">
          <div class="current-label">NOW</div>
          <img id="currentIcon" class="current-icon" alt="" />
          <div id="currentName" class="current-name">-</div>
          <div class="timer-center-readout" id="timerCenterReadout">--:--</div>
          <div id="currentRemaining" class="current-remaining hidden">-</div>
          <button class="btn details-btn hidden" id="btnDetails">Details</button>
        </div>
      </div>
      <div class="current-next">
        <div class="current-label">NEXT</div>
        <img id="nextIcon" class="current-icon" alt="" />
        <div id="nextName" class="current-name">-</div>
      </div>
      <div class="current-hint">Drag me</div>
      <div class="timer-resize" id="timerResize"></div>
    </div>

<div class="modal-overlay hidden" id="videosOverlay" role="dialog" aria-modal="true">
  <div class="modal" aria-label="Video library">
    <div class="modal-header">
      <div class="modal-title">Video Library</div>
      <button class="xbtn" id="closeVideos">✕</button>
    </div>
    <div class="modal-body">
      <div class="video-grid" id="videoButtons"></div>
    </div>

    <!-- resize handle -->
    <div class="modal-resize" id="videosResize"></div>
  </div>
</div>

    <div class="modal-overlay hidden" id="meetingsOverlay" role="dialog" aria-modal="true">
      <div class="modal" aria-label="Meetings">
        <div class="modal-header">
          <div class="modal-title">Meetings</div>
          <button class="xbtn" id="closeMeetings">✕</button>
        </div>
        <div class="modal-body">
          <div class="meetings-list">
            <button class="btn btn-yellow" id="openMorningSlides">Morning Meeting Slides</button>
            <button class="btn btn-yellow" id="openAfternoonSlides">Afternoon Meeting Slides</button>
            <button class="btn btn-yellow" id="openPowerSchool">PowerSchool</button>
            <div class="hint" id="afternoonHint"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay hidden" id="editOverlay" role="dialog" aria-modal="true">
      <div class="modal edit-modal" aria-label="Edit activity">
        <div class="modal-header">
          <div class="modal-title" id="editTitle">Edit Activity</div>
          <button class="xbtn" id="closeEdit">✕</button>
        </div>

        <div class="modal-body">
          <div class="edit-actions">
            <input id="symbolQuery" class="text-input" placeholder="Search symbols (e.g., 'math', 'recess')" />
            <div class="edit-buttons">
              <button class="btn btn-yellow" id="btnSearchCurrent">Search to Current Activity</button>
              <button class="btn btn-yellow" id="btnChangeName">Change Name</button>
              <button class="btn btn-yellow" id="btnSearchSymbols">Change Symbol</button>
            </div>
          </div>

          <div class="spinner hidden" id="symbolSpinner">Loading…</div>
          <div class="error hidden" id="symbolError">No symbols found.</div>

          <div class="symbol-grid" id="symbolResults"></div>

          <div class="hint">Tip: Click a symbol to apply immediately.</div>

          <hr class="edit-divider" />
          <div class="mini-schedule-section">
            <div class="mini-schedule-header">
              <span class="mini-schedule-title">Mini-Schedule Steps</span>
              <button class="btn btn-yellow" id="btnAddStep">Add Step</button>
            </div>
            <div id="stepsEditor" class="steps-editor"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Websites modal -->
    <div class="modal-overlay hidden" id="websitesOverlay" role="dialog" aria-modal="true">
      <div class="modal" aria-label="Websites">
        <div class="modal-header">
          <div class="modal-title">Websites</div>
          <button class="xbtn" id="closeWebsites">✕</button>
        </div>
        <div class="modal-body">
          <div class="meetings-list">
            <button class="btn btn-yellow" id="openWebPowerSchool">PowerSchool</button>
            <button class="btn btn-yellow" id="openClassroomTimer">Classroom Timer</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Classroom Timer modal -->
    <div class="modal-overlay hidden" id="timerPickerOverlay" role="dialog" aria-modal="true">
      <div class="modal" aria-label="Classroom Timer">
        <div class="modal-header">
          <div class="modal-title">Classroom Timer</div>
          <button class="xbtn" id="closeTimerPicker">✕</button>
        </div>
        <div class="modal-body">
          <div class="timer-grid" id="timerButtons"></div>
        </div>
        <div class="modal-resize" id="timerPickerResize"></div>
      </div>
    </div>

    <div id="floatLayer" class="float-layer" aria-label="Floating windows"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
